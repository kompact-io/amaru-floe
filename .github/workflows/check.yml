name: Check

# Every push/PR, not tag-gated like floe's release workflow -- this repo
# has no release artifact of its own, just "does the flake still evaluate
# and build." There's no `checks` output to run (process-compose-flake
# doesn't populate one for this config), so building the two packages that
# matter is the actual regression signal -- the same thing done by hand to
# verify every change to this repo so far.
#
# BLOCKED until amaru and floe are both pushed to real git remotes:
# flake.nix's inputs are still local `git+file:///home/waalge/...` paths,
# which don't exist on a GitHub runner. This workflow is ready to go the
# moment those are updated, not before.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#stack .#monitor -L
